<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offline — Reset Your Mind 1111™</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A0A;
      color: #C9A84C;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 360px; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; letter-spacing: 0.05em; }
    p { color: #F5F0E8; opacity: 0.75; font-size: 0.95rem; line-height: 1.5; margin-bottom: 0.75rem; }
    .small { font-size: 0.8rem; opacity: 0.5; }
  </style>
  <script>
    // Auto-refresh when back online
    window.addEventListener('online', () => location.reload());
  </script>
</head>
<body>
  <div class="container">
    <h1>Reset Your Mind 1111™</h1>
    <p>You're offline right now.<br/>Your reset continues when you reconnect.</p>
    <p class="small">Check your connection and try again.</p>
  </div>
</body>
</html>
